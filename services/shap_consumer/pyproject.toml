[project]
name = "shap_consumer"
version = "0.1.0"
description = "Batch SHAP adverse-action reason code generator (ECOA/Reg B compliance)."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "aiokafka>=0.10",
    "asyncpg>=0.29",
    "mlflow==2.22.0",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "shap>=0.45",
    "numba>=0.60",
    "llvmlite>=0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shap_consumer"]
