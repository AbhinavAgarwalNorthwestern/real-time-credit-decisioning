[project]
name = "behavioral_features"
version = "0.1.0"
description = "Streaming behavioral-feature transformer (finance domain)."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "quixstreams>=3.13.1",
    "risingwave-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavioral_features"]
