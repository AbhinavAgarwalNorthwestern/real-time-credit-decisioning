[project]
name = "training_flow"
version = "0.1.0"
description = "Day-2 offline training pipeline: synthetic backfill, RisingWave feature query, synthetic-RCT label simulation (per ADR 010), per-segment T-learner training, ONNX export, MLflow registry."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "kubernetes>=29.0",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "optuna>=3.6",
    "mlflow==2.22.0",
    "onnxscript>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/training_flow"]
