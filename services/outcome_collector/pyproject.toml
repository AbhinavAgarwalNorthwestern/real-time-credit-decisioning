[project]
name = "outcome_collector"
version = "0.1.0"
description = "Joins downstream outcomes to originating decisions for off-policy evaluation."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "aiokafka>=0.10",
    "quixstreams>=3.13.1",
    "risingwave-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outcome_collector"]
