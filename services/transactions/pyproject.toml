[project]
name = "transactions"
version = "0.1.0"
description = "Synthetic credit-transaction stream producer (finance domain)."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "quixstreams>=3.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transactions"]
