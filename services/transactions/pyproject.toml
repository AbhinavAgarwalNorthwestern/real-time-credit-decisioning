[project]
name = "transactions"
version = "0.1.0"
description = "Synthetic credit-transaction stream producer (finance domain)."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "quixstreams>=3.13.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transactions"]
