[project]
name = "bias_monitor"
version = "0.1.0"
description = "Real-time fairness monitor — consumes decisions + outcomes Kafka topics, computes demographic parity / equalized odds / predictive parity per segment and per credit-score bucket, emits Prometheus metrics + drift events on violations. FAANG Tier 1A of the credit-decisioning scope_expansion_plan.md."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "aiokafka>=0.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bias_monitor"]
