[package]
name = "decisioner"
version = "0.1.0"
edition = "2021"
description = "Rust request-path decisioner for the realtime credit-decisioning platform."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json"] }
# ONNX Runtime — loads PyTorch models exported to ONNX (per ADR 004 inference path)
ort = "2.0.0-rc.4"
ndarray = "0.16"
# Kafka producer for the async audit-log queue
rdkafka = { version = "0.36", features = ["cmake-build"] }
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.11"
log = "0.4"
anyhow = "1"
thiserror = "1"
