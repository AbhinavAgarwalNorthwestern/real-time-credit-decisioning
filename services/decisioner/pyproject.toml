[project]
name = "decisioner"
version = "0.1.0"
description = "Real-time credit-decisioning request-path service (FastAPI). See ADR 008 (supersedes Rust per ADR 004)."
requires-python = ">=3.12"
dependencies = [
    # HTTP server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Async data path
    "asyncpg>=0.29",
    "aiokafka>=0.10",
    # Inference
    "onnxruntime>=1.18",
    "numpy>=1.26",
    # Observability
    "prometheus-client>=0.20",
    "loguru>=0.7.3",
    # Config + validation
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    # Model registry
    "mlflow==2.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisioner"]
