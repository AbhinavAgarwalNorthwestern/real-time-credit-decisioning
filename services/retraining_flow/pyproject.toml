[project]
name = "retraining_flow"
version = "0.1.0"
description = "Metaflow fan-out retraining flow for the finance domain."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "metaflow>=2.12",
    "mlflow==2.22.0",
    "optuna>=3.6",
    "scikit-learn>=1.4",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retraining_flow"]
