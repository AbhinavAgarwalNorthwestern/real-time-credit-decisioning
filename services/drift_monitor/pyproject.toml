[project]
name = "drift_monitor"
version = "0.1.0"
description = "Concept-drift monitor for the finance domain (emits retraining triggers)."
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0",
    "aiokafka>=0.10",
    "evidently>=0.4,<0.5",
    "river>=0.21",
    "scipy>=1.12",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_monitor"]
