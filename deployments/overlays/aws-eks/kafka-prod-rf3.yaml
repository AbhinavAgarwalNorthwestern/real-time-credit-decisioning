# Production-grade Kafka cluster — FAANG Tier 2A.
#
# Dev (kind) uses RF=1, single-broker — fine for portfolio demos but not
# survivable. This overlay swaps to a 3-broker KRaft cluster with RF=3 and
# proper retention, applied only on the aws-eks overlay.
#
# Why these defaults:
#   - 3 brokers + RF=3: survives any single-AZ outage. Minimum for prod Kafka.
#   - min.insync.replicas=2: producers fail-loud if a broker is down rather
#     than silently writing under-replicated. Required for at-least-once delivery.
#   - 7-day retention on transactions: enough for OPE backtests + reject inference
#   - 30-day retention on decisions + outcomes: regulatory (ECOA 25-month requirement
#     is documented separately at the application audit layer)
#   - 14-day retention on drift-events: investigations may go back 2 weeks

apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role-prod
  labels:
    strimzi.io/cluster: kafka-e11b
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        kraftMetadata: shared
        # gp3 is the right balance of throughput + cost for Kafka in AWS
        class: gp3
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 6Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-e11b
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.2
    metadataVersion: 4.1-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Auto-create topics only as a safety net — real topics are managed
      # by KafkaTopic CRs (declarative + versioned in git).
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# Topic with prod retention + RF=3.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-e11b
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000      # 7 days
    cleanup.policy: delete
    min.insync.replicas: '2'
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: decisions
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-e11b
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000     # 30 days (decisioner audit trail)
    cleanup.policy: delete
    min.insync.replicas: '2'
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: outcomes
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-e11b
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000     # 30 days (for OPE backtests)
    cleanup.policy: delete
    min.insync.replicas: '2'
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: drift-events
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-e11b
spec:
  partitions: 1
  replicas: 3
  config:
    retention.ms: 1209600000     # 14 days
    cleanup.policy: delete
    min.insync.replicas: '2'
