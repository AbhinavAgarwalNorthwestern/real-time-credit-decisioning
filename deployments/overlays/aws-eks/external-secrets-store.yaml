# AWS Secrets Manager backend for External Secrets Operator.
# Applied as part of the aws-eks overlay; the base/ stays cloud-agnostic.
#
# Authentication: uses IRSA (IAM Roles for Service Accounts) — no static
# credentials in the cluster. The operator's ServiceAccount is annotated
# with an IAM role that has secretsmanager:GetSecretValue permission.
# Terraform module `infra/terraform/modules/iam_irsa/` provisions this role.

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-irsa
            namespace: external-secrets
---
# Rotation policy — refreshes secrets every hour.
# Apps consuming via the resulting K8s Secret pick up new values on pod
# restart (or via a sidecar that watches the Secret if hot-reload is needed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mlflow-minio-secret
  namespace: mlflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Output K8s Secret name — must match the existing app references so
    # apps don't need code changes when we cut over from manual to ESO-managed.
    name: mlflow-minio-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        # The AWS Secrets Manager secret path; structured as a JSON blob with
        # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY fields. Terraform
        # provisions this and the lambda-based 90-day rotation.
        key: prod/credit-decisioning/mlflow-minio
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: prod/credit-decisioning/mlflow-minio
        property: AWS_SECRET_ACCESS_KEY
---
# Same pattern for the transactions producer's checkpoint MinIO/S3 creds.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transactions-state-checkpoint-secret
  namespace: real-time-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: transactions-state-checkpoint-secret
    creationPolicy: Owner
  data:
    - secretKey: TXN_STATE_MINIO_ACCESS_KEY
      remoteRef:
        key: prod/credit-decisioning/transactions-state
        property: AWS_ACCESS_KEY_ID
    - secretKey: TXN_STATE_MINIO_SECRET_KEY
      remoteRef:
        key: prod/credit-decisioning/transactions-state
        property: AWS_SECRET_ACCESS_KEY
