# External Secrets Operator (ESO) installation — FAANG Tier 1D.
#
# ESO is the cloud-agnostic secret-rotation pattern: it watches `ExternalSecret`
# resources in the cluster and reconciles them by reading from the configured
# upstream secret backend, creating standard K8s `Secret` objects automatically.
# This means application code reads from K8s Secrets (the standard pattern),
# while operations stores actual secrets in AWS Secrets Manager / GCP Secret
# Manager / HashiCorp Vault / Azure Key Vault.
#
# Why ESO instead of cloud-native CSI drivers (Secrets Store CSI / AWS SSM):
#   1. SAME yaml across all clouds — overlays just swap the SecretStore backend
#   2. Built-in rotation — refreshInterval pulls new versions periodically
#   3. Native K8s Secret as the output — no app code changes needed
#   4. Compatible with our existing mlflow-minio-secret consumers (decisioner,
#      bias_monitor, transactions producer) — they keep reading K8s Secrets
#
# Installation: this manifest installs the operator from the upstream Helm chart
# via raw YAML (chart-rendered). For prod, prefer `helm install external-secrets`
# with proper version pinning + values files.
#
# Day-2 ops: see docs/runbooks/secret_rotation.md (creates per-secret manifests
# referencing this operator).

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets-operator
---
# Note: in production, install the operator via the official Helm chart:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \\
#     -n external-secrets --create-namespace --set installCRDs=true
#
# For dev / kind, the chart-rendered all-in-one manifest can be fetched and
# applied directly. We leave that one-line install to deployments/dev/kind/
# install_external_secrets.sh — see that script for the dev install.
#
# The CRDs the operator provides:
#   - SecretStore (namespace-scoped backend config: AWS SM, GCP SM, Vault, ...)
#   - ClusterSecretStore (cluster-scoped equivalent)
#   - ExternalSecret (request to fetch + create a K8s Secret)
#   - PushSecret (push K8s Secret back to a backend)
