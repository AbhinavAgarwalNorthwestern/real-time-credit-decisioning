apiVersion: apps/v1
kind: Deployment
metadata:
  name: outcome-collector
  labels:
    app.kubernetes.io/name: outcome-collector
    app.kubernetes.io/component: collector
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outcome-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outcome-collector
        app.kubernetes.io/component: collector
        tier: service
    spec:
      containers:
        - name: outcome-collector
          image: outcome-collector
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: outcome-collector-config
            - configMapRef:
                name: cluster-config
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: KAFKA_BROKER
      restartPolicy: Always
