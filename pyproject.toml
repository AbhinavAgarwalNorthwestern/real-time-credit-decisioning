[project]
name = "realtime-credit-decisioning-platform"
version = "0.1.0"
description = "Real-time credit-decisioning platform with neural uplift models, contextual bandit selection, champion-challenger MLOps, and a low-latency Python+FastAPI decision API (per ADR 008, supersedes ADR 004)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "quixstreams>=3.13.1",
    "mlflow==2.22.0",
    "risingwave-py",
    "boto3>=1.42.69",
]

[project.optional-dependencies]
dev = []

[tool.uv.workspace]
members = [
    # Finance pipeline (ADR 004 collapsed request path; ADR 008 made the
    # decisioner Python+FastAPI rather than Rust)
    # NOTE: services/behavioral_features removed per ADR 009 — feature
    # computation moved to pure RisingWave SQL (deployments/dev/risingwave/)
    # NOTE: services/news and services/news-sentiment removed per ADR 011
    # (supersedes ADR 007). Directories remain in the repo as Pau's-course
    # archive but are no longer workspace members and the `macro_sentiment_1h`
    # feature they would have fed is dropped from the platform.
    "services/transactions",
    "services/training_flow",
    "services/decisioner",
    "services/drift_monitor",
    "services/retraining_flow",
    "services/outcome_collector",
    "services/shap_consumer",
    "services/bias_monitor",
    # Cloud-touch abstractions (imported by application services)
    "infra/lib",
]

[tool.uv.sources]
risingwave-py = { git = "https://github.com/risingwavelabs/risingwave-py" }



[tool.ruff]
line-length = 88
extend-exclude = [
    # Generated code — BAML auto-generates these; never style-check
    "**/baml_client",
]
lint.select = [
    "C",  # mccabe rules
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "W",  # pycodestyle warning rules
    "B",  # flake8-bugbear rules
    "I",  # isort rules
]
lint.ignore = [
    "C901",  # max-complexity-10
    "E501",  # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["services"]
markers = [
    "integration: tests that mock external services (RW, Kafka, K8s) but test cross-module wiring",
    "pipeline: end-to-end pipeline tests in offline mode (no cluster, synthetic data only)",
]
addopts = "-m 'not integration and not pipeline'"
filterwarnings = [
    "ignore::DeprecationWarning:onnxruntime.*",
]

[tool.mypy]
strict = true
# Tolerate missing third-party stubs (loguru, fire, opik, baml_py, etc.).
# Application code remains type-checked; only the import resolution is relaxed.
ignore_missing_imports = true
exclude = [
    # Generated code (BAML auto-generated)
    ".*baml_client.*",
    # Retained cohort code (ADR 007 — known debt; refactor scheduled for Day 1+)
    "services/news/",
    "services/news-sentiment/",
]
