name: ci

on:
  pull_request:
    branches: [main]
  push:
    # main: gate of record. abhinav/**: feature-branch fast feedback so
    # we don't ship images to ECR without lint/typecheck/tests having
    # run on the exact commit being built.
    branches: [main, 'abhinav/**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          uv sync --all-packages --all-extras || uv sync --all-packages
          uv pip install ruff

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          uv sync --all-packages --all-extras || uv sync --all-packages
          uv pip install mypy

      - name: Mypy strict
        run: |
          uv run mypy --strict \
            services/transactions/src/ \
            services/training_flow/src/ \
            services/decisioner/src/ \
            services/drift_monitor/src/ \
            services/retraining_flow/src/ \
            services/outcome_collector/src/ \
            services/shap_consumer/src/ \
            services/bias_monitor/src/

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          uv sync --all-packages --all-extras || uv sync --all-packages
          uv pip install pytest pytest-asyncio pytest-mock

      - name: Unit tests (fast, no cluster needed)
        run: uv run pytest --import-mode=importlib -m "not integration and not pipeline" -q --tb=short

  integration-test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          uv sync --all-packages --all-extras || uv sync --all-packages
          uv pip install pytest pytest-asyncio pytest-mock

      - name: Integration tests (RW/Kafka mocked, no live cluster)
        run: uv run pytest --import-mode=importlib -m integration -q --tb=short

  pipeline-test:
    runs-on: ubuntu-latest
    needs: [integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install workspace packages
        run: |
          uv sync --all-packages --all-extras || uv sync --all-packages
          uv pip install pytest pytest-asyncio pytest-mock

      - name: Pipeline smoke test (offline mode, synthetic data)
        run: uv run pytest --import-mode=importlib -m pipeline -q --tb=short
        env:
          ORT_LOG_LEVEL: ERROR

  # rust-check job removed per ADR 008 — the decisioner is now Python+FastAPI.
  # Re-introduce if a Rust optimization pass is undertaken later.

  kustomize-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeval
        run: |
          curl -L https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/kubeval /usr/local/bin/

      - name: Validate local-kind overlay
        run: kubectl kustomize deployments/overlays/local-kind | kubeval --strict --ignore-missing-schemas

      - name: Validate aws-eks overlay
        run: kubectl kustomize deployments/overlays/aws-eks | kubeval --strict --ignore-missing-schemas
